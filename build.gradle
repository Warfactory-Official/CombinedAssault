plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

sourceSets.main.resources { srcDir 'src/generated/resources' }

neoForge {
    version = neo_version

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run/client_1')
            // Test content requested under this property; client != server => join refuses registries.
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            // JBR-only, and every JBR on this machine is 25.x while the toolchain is 21. A stock JDK
            // refuses to start at all on an unknown -XX flag, so let it skip the option rather than die.
            jvmArgument("-XX:+IgnoreUnrecognizedVMOptions")
            jvmArgument("-XX:+AllowEnhancedClassRedefinition")

            // -PquickPlay=<world> boots straight into a save instead of the main menu, so an
            // automated check has no menu clicks to get right blind.
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlay').toString()
            }
        }

        client2 {
            client()
            gameDirectory = project.file('run/client_2')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            programArguments.addAll("--username", "Ranpoes")
        }

        server {
            server()
            gameDirectory = project.file('run/server')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        // The tow trials drive a server of their own for hours at a time. run/server is the one a
        // person is likely to be sitting in, and a harness that takes that over kills whatever was
        // already running there and rewrites its server.properties underneath it.
        towServer {
            server()
            gameDirectory = project.file('run/tow-server')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            // Headless. A dedicated server with no argument opens Minecraft's own Swing console,
            // which takes the focus off whatever the person at the keyboard was doing.
            programArgument 'nogui'
        }

        // Headless verification. ./gradlew runGameTestServer runs every @GameTest in the mod and exits
        // non-zero on a failure, which is the only way anything in this project gets checked without a
        // screenshot.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('run/gametest')
            // -Pbench[=substring] => ClimbBench/PhysicsBench only, cases filtered
            systemProperty 'neoforge.enabledGameTestNamespaces', project.hasProperty('bench') ? 'combinedassaultbench' : mod_id
            systemProperty 'combinedassault.bench.filter', project.findProperty('bench') ?: ''
            systemProperty 'combinedassault.test.filter', project.findProperty('testFilter') ?: ''
            systemProperty 'combinedassault.bench.trace', project.hasProperty('benchTrace') ? 'true' : 'false'
            systemProperty 'wflib.physics.debug', project.hasProperty('rigidDebug') ? 'true' : 'false'
            systemProperty 'wflib.physics.debugAll', project.hasProperty('rigidDebugAll') ? 'true' : 'false'
            systemProperty 'wflib.physics.substeps', project.findProperty('rigidSubsteps') ?: '4'
            systemProperty 'wflib.physics.iterations', project.findProperty('rigidIterations') ?: '1'
            // -Pjfr => run/gametest/bench.jfr
            if (project.hasProperty('jfr')) {
                jvmArgument('-XX:StartFlightRecording=filename=bench.jfr,settings=profile,jdk.ExecutionSample#period=1ms')
            }
        }
    }
}

repositories {
    mavenCentral()
    flatDir {
        dir 'libs'
    }
    // A local WFLib (`publishToMavenLocal` in its checkout) wins over the published snapshot of the same version.
    mavenLocal { content { includeGroup 'com.wf.wflib'; includeGroup 'warfactory.ultimateweight' } }
    maven {
        name = 'Warfactory Snapshots'
        url = 'https://repo.warfactory.co/snapshots'
        content { includeGroup 'com.wf.wflib'; includeGroup 'com.norwood'; includeGroup 'com.wf.gemrender' }
        // Anonymous reads work on this server; only `publish` needs credentials. A present-but-null
        // credentials block makes Gradle refuse anonymous reads too, so omit it entirely when unset.
        def warfactoryUser = project.findProperty('warfactoryUser') ?: System.getenv('WARFACTORY_MAVEN_USER')
        def warfactoryToken = project.findProperty('warfactoryToken') ?: System.getenv('WARFACTORY_MAVEN_TOKEN')
        if (warfactoryUser != null && warfactoryToken != null) {
            credentials {
                username = warfactoryUser
                password = warfactoryToken
            }
        }
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        url = "https://maven.ryanhcode.dev/releases"
    }
    maven {
        name = "createmod maven" // Engine-Room Flywheel, which GemRender draws through
        url = "https://maven.createmod.net"
        content { includeGroupAndSubgroups 'dev.engine-room' }
    }
    maven {
        url = 'https://maven.sighs.cc/repository/maven-public/'
    }
    maven {
        name = 'KosmX'
        url = 'https://maven.kosmx.dev/'
        content { includeGroup 'dev.kosmx.player-anim' }
    }
}

configurations {
    clientRunMods { transitive = false }
    gemRenderRuntimeJar { transitive = false }
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
    all { resolutionStrategy.cacheChangingModulesFor(0, 'seconds') }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    // NeoForge pins slf4j-api strictly (2.0.9); ArchUnit's 2.0.12 conflicts.
    testImplementation('com.tngtech.archunit:archunit-junit5:1.3.0') { exclude group: 'org.slf4j' }
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // JS支持
    jarJar(implementation('org.ywzj:rhino:1.8.1')) {
        version {
            strictly '[1.8.1,)'
            prefer '1.8.1'
        }
    }
    additionalRuntimeClasspath 'org.ywzj:rhino:1.8.1'
    // MAE: animation pose graph
    jarJar(implementation('com.maydaymemory:mae:1.1.2')) {
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'it.unimi.dsi', module: 'fastutil'
        exclude group: 'org.joml', module: 'joml'
        version {
            strictly '[1.1.2,)'
            prefer '1.1.2'
        }
    }
    // apricityui
    jarJar(implementation 'com.sighs:ApricityUI-neoforge-1.21.1:1.2.4-hotfix') {
        version {
            strictly '[1.2.4-hotfix,)'
            prefer '1.2.4-hotfix'
        }
    }
    // spark
    implementation "curse.maven:spark-361579:6225208"
    // performance
    // Sodium 0.8 outer jar = early service + nested mod: on the run classpath the nested mod is dropped => run mods/ only.
    clientRunMods "maven.modrinth:sodium:mc1.21.1-0.8.12-beta.2-neoforge"
    implementation "maven.modrinth:iris:1.8.14-beta.1+1.21.1-neoforge"
    compileOnly "curse.maven:accelerated-rendering-1314021:8448200"
    // JEI
    implementation "curse.maven:jei-238222:7420587"
    // worldedit
    implementation "curse.maven:worldedit-225608:5830452"
    // create
    implementation "curse.maven:create-328085:7963363"
    implementation "maven.modrinth:sable:2.0.6+mc1.21.1"
    compileOnly("dev.ryanhcode.sable-companion:sable-companion-common-${project.minecraft_version}:${project.sable_companion_version}")
    implementation "maven.modrinth:create-aeronautics:1.3.2+mc1.21.1"
    // WFLib: required. Its Flywheel/GemRender deps are side = "CLIENT"; installClientMods supplies them to
    // client runs, a server run needs neither.
    implementation "com.wf.wflib:wflib:${wflib_version}-SNAPSHOT"
    // wfweight: no API use; on dev runs so wflib compat.wfweight bridges load.
    localRuntime "warfactory.ultimateweight:wfweight-1.21.1-neoforge:1.0.0-SNAPSHOT@jar" // shaded (snakeyaml); module runtime variant = -dev jar without it
    // AHF: seat pose sets (rig = drawn pose) + vehicle-tilt stance. PlayerAnimator: client-only mod, draws seat poses.
    implementation "com.norwood:ahf-1.21.1-neoforge:${ahf_version}-SNAPSHOT"
    implementation "dev.kosmx.player-anim:player-animation-lib-forge:${project.playeranimator_version}"

    // GemRender (+ Flywheel): required on the client, absent on a server run => compileOnly; runtime via installClientMods.
    compileOnly "com.wf.gemrender:gemrender-1.21.1:${gemrender_version}-SNAPSHOT"
    gemRenderRuntimeJar "com.wf.gemrender:gemrender-1.21.1:${gemrender_version}-SNAPSHOT"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6"

    // Immersive Railroading, so a vehicle can be strapped to a flatcar. compileOnly only:
    // com.wf.combinedassault.deck.rail is the only package that names an IR type and every entry point is
    // behind ModList. UniversalModCore comes with it because IR stopped shading it at 1.11.0.
    // -PwithRail puts both on the run classpath, which is the only way the carriage path can be
    // exercised; with them absent the compat correctly does nothing.
    compileOnly "maven.modrinth:immersive-railroading:${project.immersive_railroading_version}"
    compileOnly "maven.modrinth:universal-mod-core:${project.universal_mod_core_version}"
    if (project.hasProperty('withRail')) {
        runtimeOnly "maven.modrinth:immersive-railroading:${project.immersive_railroading_version}"
        runtimeOnly "maven.modrinth:universal-mod-core:${project.universal_mod_core_version}"
        runtimeOnly "maven.modrinth:track-api:${project.track_api_version}"
    }

    additionalRuntimeClasspath 'org.ywzj:rhino:1.8.1'
    additionalRuntimeClasspath('com.maydaymemory:mae:1.1.2') { transitive = false }
}

// GemRender + clientRunMods -> client run mods/, not run classpath: client only, server run must not see them.
// Also staged in build/clientRunMods for mc-harness.
def gemRenderJar = configurations.gemRenderRuntimeJar.singleFile
def clientRunDirs = [file('run/client_1'), file('run/client_2'), file('build/clientRunMods')]
def installClientMods = tasks.register('installClientMods') {
    group = 'combinedassault'
    description = 'Puts GemRender and clientRunMods in every client run directory.'
    def jars = files(gemRenderJar, configurations.clientRunMods)
    inputs.files(jars)
    outputs.dirs(clientRunDirs.collect { new File(it, 'mods') })
    doLast {
        def names = jars.files*.name as Set
        // Mod id = jar name up to its version: an older copy would be a second mod with the same id (load error).
        def stem = { String n -> n.replaceFirst(/[-_]?(mc)?\d.*$/, '') }
        def stems = names.collect(stem) as Set
        clientRunDirs.each { runDir ->
            File mods = new File(runDir, 'mods')
            mods.mkdirs()
            mods.listFiles()?.each { jar ->
                if (!(jar.name in names) && stem(jar.name) in stems) {
                    jar.delete()
                }
            }
            jars.files.each { jar ->
                File target = new File(mods, jar.name)
                if (!target.exists() || !Arrays.equals(target.bytes, jar.bytes)) {
                    target.bytes = jar.bytes
                }
            }
        }
    }
}
neoForge.ideSyncTask(installClientMods)

// Sync-only install => IDE launch kept a stale jar (NoSuchFieldError jointUvBase).
['prepareClientRun', 'prepareClient2Run'].each { name ->
    tasks.named(name).configure { dependsOn installClientMods }
}

// Bench packs (tools/internal/bench_pack.py) only under -Pbench: the suite must see the shipped packs alone.
tasks.named('runGameTestServer').configure {
    doFirst {
        File bench = project.file('run/gametest/combinedassault/packs/bench')
        project.delete(bench)
        if (project.hasProperty('bench')) {
            project.exec { commandLine 'python3', 'tools/internal/bench_pack.py', bench.path }
        }
    }
}

tasks.named('jar', Jar).configure {
    from('LICENSE.txt', 'LICENSE-CC-BY-NC-4.0.txt', 'ASSETS.md')
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact tasks.named('jar')
            groupId = mod_group_id
            artifactId = mod_id
            version = "${mod_version}-SNAPSHOT"
        }
    }
    repositories {
        maven {
            name = 'WarfactorySnapshots'
            url = 'https://repo.warfactory.co/snapshots'
            def warfactoryUser = project.findProperty('warfactoryUser') ?: System.getenv('WARFACTORY_MAVEN_USER')
            def warfactoryToken = project.findProperty('warfactoryToken') ?: System.getenv('WARFACTORY_MAVEN_TOKEN')
            credentials {
                username = warfactoryUser
                password = warfactoryToken
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    systemProperty 'combinedassault.architectureDoc', file('docs/internal/ARCHITECTURE.md').absolutePath
    maxHeapSize = '3g'
}

idea {
    module {
        // Worlds/logs ~24 GB => IDE heap exhaustion while indexing.
        excludeDirs += projectDir.listFiles().findAll { it.directory && it.name.startsWith('run') }
    }
}
