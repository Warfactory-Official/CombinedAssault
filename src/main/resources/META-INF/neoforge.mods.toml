modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''CombinedAssault (Open Beta). The current features and art assets are under development and do not represent the final quality of the game.''''

[[dependencies.${ mod_id }]]
modId = "neoforge"
mandatory = true
versionRange = "${loader_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "wflib"
type = "required"
versionRange = "[1.8.33,2)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "ahf"
type = "required"
versionRange = "[1.0.8,2)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "playeranimator"
type = "required"
versionRange = "[2.0.4,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${ mod_id }]]
modId = "gemrender"
type = "required"
versionRange = "[0.1.16,1)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${ mod_id }]]
modId = "acceleratedrendering"
type = "optional"
versionRange = "[0,)"
ordering = "NONE"
side = "CLIENT"

[[mixins]]
config = "mixins.combinedassault.json"
